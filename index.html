<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>روابط صالحة</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="روابط صالحة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1b2f55">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --line:#dde3ea; --fg:#14213a; --muted:#5d6b80;
  --navy:#1b2f55; --accent:#e8701a; --accent-soft:#fdebdc; --danger:#c0392b;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1525; --surface:#162038; --line:#27324b; --fg:#e7ecf4; --muted:#93a0b6;
  --navy:#9fb6e3; --accent:#f28a3c; --accent-soft:#3a2615; --danger:#ef6f60; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;color:var(--navy)}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--accent);color:#fff;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.6}
.btn:focus-visible,.icon:focus-visible,input:focus-visible,a:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
section h2{font-family:var(--f-display);font-weight:500;font-size:.8rem;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row a{flex:1;min-width:0;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px}
.t{font-weight:600}
.u{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{font-size:.82rem;color:var(--muted)}
.icon{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.icon:hover{background:var(--accent-soft);color:var(--accent)}
.icon svg{width:18px;height:18px}
.state{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.login{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.login h3{font-family:var(--f-display);margin:0;color:var(--navy)}
dialog{border:0;border-radius:16px;padding:0;width:min(92vw,460px);background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(10,16,30,.5)}
form{display:flex;flex-direction:column;gap:12px;padding:20px}
form h3{font-family:var(--f-display);margin:0;font-size:1.15rem;color:var(--navy)}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input.ltr{direction:ltr;text-align:left;font-family:var(--f-mono);font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--danger);font-size:.85rem;margin:0}
.who{font-size:.78rem;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between;direction:ltr}
.who button{border:0;background:none;color:var(--accent);font-size:.8rem;padding:0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:30}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}.row:hover{background:var(--accent-soft)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>روابط <span>صالحة</span></h1>
      <p class="sub" id="count">كل روابط مشاريعك في مكان واحد</p>
    </div>
    <button class="btn" id="addBtn" hidden>+ إضافة</button>
  </header>

  <form class="login" id="loginBox" hidden>
    <h3>تسجيل الدخول</h3>
    <label>البريد<input id="email" class="ltr" type="email" autocomplete="username" required></label>
    <label>كلمة المرور<input id="pass" class="ltr" type="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" hidden></p>
    <div class="actions"><button class="btn" type="submit" id="loginBtn">دخول</button></div>
  </form>

  <div id="main" hidden style="display:flex;flex-direction:column;gap:18px">
    <input class="search" id="q" type="search" placeholder="ابحث: فواتير، NMS، github…" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div id="out"></div>
    <div class="who"><span id="who"></span><button id="logoutBtn" type="button">خروج</button></div>
  </div>

  <div id="boot" class="state">جاري التحميل…</div>
</div>

<dialog id="dlg">
  <form id="frm">
    <h3 id="dlgTitle">رابط جديد</h3>
    <label>الاسم<input id="fTitle" required placeholder="مثال: نظام الفواتير"></label>
    <label>الرابط<input id="fUrl" class="ltr" required inputmode="url" placeholder="https://"></label>
    <label>المشروع / المجموعة<input id="fGroup" list="groups" required placeholder="مثال: NMS PLAYER"></label>
    <datalist id="groups"></datalist>
    <label>ملاحظة (اختياري)<input id="fNote" placeholder="مثال: دخول بحساب المالك"></label>
    <p class="err" id="fErr" hidden></p>
    <div class="actions">
      <button class="btn" type="submit" id="saveBtn">حفظ</button>
      <button class="btn ghost" type="button" id="cancelBtn">إلغاء</button>
      <button class="btn danger" type="button" id="delBtn" hidden>حذف</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" hidden></div>

<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyBtbx1mLPoABObVi-dmFu7PP6S4BwUOQY8",
  authDomain:        "nms-player.firebaseapp.com",
  projectId:         "nms-player",
  storageBucket:     "nms-player.firebasestorage.app",
  messagingSenderId: "175465922473",
  appId:             "1:175465922473:web:9a16ff0d947b60c7eb0eb8"
};
const COLLECTION = "links";

// الروابط الأساسية — تُضاف مرة واحدة بزر عند أول تشغيل
const STARTER = [
  ["rechnungen","نظام الفواتير","https://iphonesalha-web.github.io/rechnungen/","SALHA AUTOTEILE","الفواتير والإغلاق الشهري"],
  ["fb-rechnungen","Firebase — مشروع الفواتير","https://console.firebase.google.com/project/salha-rechnungen","SALHA AUTOTEILE","salha-rechnungen"],
  ["nms-panel","لوحة أكواد التفعيل","https://iphonesalha-web.github.io/nms-panel/","NMS PLAYER","إدارة ورفع الأكواد"],
  ["nms-site","موقع البيع","https://iphonesalha-web.github.io/nms/","NMS PLAYER",""],
  ["nms-upd","تحديثات التطبيق (Releases)","https://github.com/iphonesalha-web/nms-upd-9k4z/releases","NMS PLAYER",""],
  ["fb-nms","Firebase — مشروع NMS","https://console.firebase.google.com/project/nms-player","NMS PLAYER","الأكواد + إرسال السيرفر + الروابط"],
  ["lb4k-push","صفحة إرسال السيرفر","https://iphonesalha-web.github.io/lb4k-push-q7w/","LIBANON 4K Pro","إرسال السيرفر بكود الجهاز"],
  ["lb4k-upd","تحديثات التطبيق (Releases)","https://github.com/iphonesalha-web/lb4k-upd-7k2x/releases","LIBANON 4K Pro",""],
  ["scan","صالحة سكان","https://iphonesalha-web.github.io/-salha-scan/","تطبيقات الآيفون",""],
  ["nabd","نبض العملات","https://iphonesalha-web.github.io/nabd-al-umlat/","تطبيقات الآيفون",""],
  ["links","روابط صالحة","https://iphonesalha-web.github.io/salha-links/","عام","هذه الصفحة"],
  ["github","حساب GitHub","https://github.com/iphonesalha-web","عام","كل المستودعات"],
  ["firebase","Firebase Console","https://console.firebase.google.com/","عام",""]
];

const $=id=>document.getElementById(id);
const ICON_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const ICON_EDIT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
let db, auth, col, unsub=null, links=[], loaded=false, filter='الكل', editing=null, delArmed=false;

function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800)}
function host(u){try{const x=new URL(u);return x.host+x.pathname.replace(/\/$/,'')}catch{return u}}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function state(msg){const s=el('div','state',msg);$('out').replaceChildren(s);return s}

function copyText(text){
  const ok=()=>toast('تم نسخ الرابط');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    let d=false;try{d=document.execCommand('copy')}catch(e){}ta.remove();d?ok():toast('تعذّر النسخ')};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(ok).catch(fallback);else fallback();
}

function render(){
  const groups=[...new Set(links.map(l=>l.group))];
  if(filter!=='الكل'&&!groups.includes(filter))filter='الكل';
  $('groups').replaceChildren(...groups.map(g=>{const o=document.createElement('option');o.value=g;return o}));
  $('chips').replaceChildren(...['الكل',...groups].map(g=>{const b=el('button','chip',g);b.type='button';b.setAttribute('aria-pressed',g===filter);b.onclick=()=>{filter=g;render()};return b}));
  $('count').textContent=links.length?`${links.length} رابط في ${groups.length} مشاريع`:'كل روابط مشاريعك في مكان واحد';
  if(!loaded){state('جاري تحميل الروابط…');return}
  if(!links.length){
    const s=state('لا توجد روابط بعد.');
    const b=el('button','btn',`إضافة الروابط الأساسية (${STARTER.length})`);b.type='button';b.onclick=()=>seed(b);s.append(b);return}
  const q=$('q').value.trim().toLowerCase();
  const shown=links.filter(l=>(filter==='الكل'||l.group===filter)&&(!q||[l.title,l.url,l.group,l.note].join(' ').toLowerCase().includes(q)));
  if(!shown.length){state('لا نتائج لهذا البحث.');return}
  const wrap=el('div');wrap.style.cssText='display:flex;flex-direction:column;gap:18px';
  groups.forEach(g=>{
    const items=shown.filter(l=>l.group===g);if(!items.length)return;
    const s=el('section'),h=el('h2');h.append(el('span',null,g),el('span',null,String(items.length)));s.append(h);
    const list=el('div','list');
    items.forEach(l=>{
      const r=el('div','row'),a=el('a');a.href=l.url;a.target='_blank';a.rel='noopener';
      a.append(el('span','t',l.title),el('span','u',host(l.url)));if(l.note)a.append(el('span','n',l.note));
      const c=el('button','icon');c.type='button';c.innerHTML=ICON_COPY;c.title='نسخ الرابط';c.setAttribute('aria-label','نسخ الرابط');c.onclick=()=>copyText(l.url);
      const e=el('button','icon');e.type='button';e.innerHTML=ICON_EDIT;e.title='تعديل';e.setAttribute('aria-label','تعديل');e.onclick=()=>openDlg(l);
      r.append(a,c,e);list.append(r)});
    s.append(list);wrap.append(s)});
  $('out').replaceChildren(wrap);
}
$('q').addEventListener('input',render);

async function seed(btn){
  btn.disabled=true;
  try{const batch=db.batch();
    STARTER.forEach(([id,title,url,group,note],i)=>batch.set(col.doc(id),{title,url,group,note,order:(i+1)*10}));
    await batch.commit();toast('تمت إضافة الروابط');
  }catch(e){toast('فشل: '+e.message);btn.disabled=false}
}

function openDlg(l){
  editing=l||null;delArmed=false;
  $('dlgTitle').textContent=l?'تعديل الرابط':'رابط جديد';
  $('fTitle').value=l?.title||'';$('fUrl').value=l?.url||'';$('fGroup').value=l?.group||(filter!=='الكل'?filter:'');$('fNote').value=l?.note||'';
  $('delBtn').hidden=!l;$('delBtn').textContent='حذف';$('fErr').hidden=true;
  $('dlg').showModal();
}
$('addBtn').onclick=()=>openDlg();
$('cancelBtn').onclick=()=>$('dlg').close();
$('frm').addEventListener('submit',async e=>{
  e.preventDefault();
  let url=$('fUrl').value.trim();if(!/^[a-z]+:\/\//i.test(url))url='https://'+url;
  const data={title:$('fTitle').value.trim(),url,group:$('fGroup').value.trim(),note:$('fNote').value.trim(),order:editing?.order??Date.now()};
  $('saveBtn').disabled=true;
  try{editing?await col.doc(editing.id).set(data):await col.add(data);$('dlg').close();toast('تم الحفظ')}
  catch(err){$('fErr').textContent='لم يتم الحفظ: '+err.message;$('fErr').hidden=false}
  finally{$('saveBtn').disabled=false}
});
$('delBtn').onclick=async()=>{
  if(!delArmed){delArmed=true;$('delBtn').textContent='اضغط مرة ثانية للتأكيد';return}
  try{await col.doc(editing.id).delete();$('dlg').close();toast('تم الحذف')}
  catch(e){$('fErr').textContent='لم يتم الحذف: '+e.message;$('fErr').hidden=false}
};

/* ---------- Firebase ---------- */
function loadScript(urls){return new Promise((res,rej)=>{let i=0;const next=()=>{if(i>=urls.length)return rej(new Error('load'));
  const s=document.createElement('script');s.src=urls[i++];s.onload=res;s.onerror=next;document.head.appendChild(s)};next()})}
const SDK=v=>[`https://www.gstatic.com/firebasejs/10.12.5/firebase-${v}-compat.js`,`https://cdn.jsdelivr.net/npm/firebase@10.12.5/firebase-${v}-compat.js`];

function showLogin(){if(unsub){unsub();unsub=null}$('boot').hidden=true;$('main').hidden=true;$('addBtn').hidden=true;$('loginBox').hidden=false}
function showApp(user){
  $('boot').hidden=true;$('loginBox').hidden=true;$('main').hidden=false;$('addBtn').hidden=false;$('who').textContent=user.email;
  loaded=false;render();
  unsub=col.orderBy('order').onSnapshot(snap=>{links=snap.docs.map(d=>({id:d.id,...d.data()}));loaded=true;render()},
    e=>{loaded=true;state('تعذّر تحميل الروابط: '+e.message)});
}
$('loginBox').addEventListener('submit',e=>{
  e.preventDefault();$('loginErr').hidden=true;$('loginBtn').disabled=true;
  auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value)
    .catch(()=>{$('loginErr').textContent='البريد أو كلمة المرور غير صحيحة';$('loginErr').hidden=false})
    .finally(()=>$('loginBtn').disabled=false);
});
$('logoutBtn').onclick=()=>auth.signOut();

(async()=>{
  try{await loadScript(SDK('app'));await loadScript(SDK('auth'));await loadScript(SDK('firestore'))}
  catch{$('boot').textContent='تعذّر تحميل Firebase. تأكد من الإنترنت ثم أعد فتح الصفحة.';return}
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();db=firebase.firestore();col=db.collection(COLLECTION);
  auth.onAuthStateChanged(u=>u?showApp(u):showLogin());
})();
</script>
</body>
</html>
